<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ProBike Gym 3D Anatomy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090A0F; /* ProBike OLED Black */
      touch-action: none;
    }
    #viewer-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #090A0F;
      color: #8E9BAE;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
      z-index: 10;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(204, 255, 0, 0.15);
      border-top-color: #CCFF00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="viewer-container"></div>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <span>Loading 3D Anatomy...</span>
  </div>

  <script src="gym_viewer_bundle.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const glbUrl = '../models/male_anatomy.glb';
        const manifestUrl = '../models/manifest.json';
        await window.initGymViewer('viewer-container', glbUrl, manifestUrl);
        const overlay = document.getElementById('loading-overlay');
        if (overlay) {
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 300);
        }
      } catch (err) {
        console.error('Failed to init Gym 3D Viewer:', err);
      }
    });

    // Public API for Flutter / Native Platform Channel
    window.setInteractionMode = function(mode) {
      if (window.gymViewer) window.gymViewer.setInteractionMode(mode);
    };

    window.setCameraView = function(view) {
      if (window.gymViewer) window.gymViewer.setCameraView(view);
    };

    window.selectMuscle = function(muscleGroup) {
      if (window.gymViewer) window.gymViewer.selectMuscle(muscleGroup);
    };
  </script>
</body>
</html>
