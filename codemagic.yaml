workflows:
  ios-unsigned-ipa:
    name: iOS Unsigned IPA (Sideload / AltStore)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Enable Swift Package Manager
        script: |
          flutter config --enable-swift-package-manager
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Analyze code
        script: |
          flutter analyze
      - name: Run automated test suite
        script: |
          flutter test
      - name: Build iOS unsigned release
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y ProBike_iOS.ipa Payload
    artifacts:
      - ProBike_iOS.ipa

